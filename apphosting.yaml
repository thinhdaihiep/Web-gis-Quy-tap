# Settings for Cloud Run service created by Firebase App Hosting
runConfig:
  cpu: 1
  memoryMiB: 1024
  concurrency: 80
  maxInstances: 10
  minInstances: 0

# Custom build and run scripts for custom Node.js/Express + Vite app
scripts:
  buildCommand: npm run build
  runCommand: node dist/server.cjs

# Environment variables
env:
  - variable: NODE_ENV
    value: production
